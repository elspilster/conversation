<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversation</title><style>body{margin:0;background:#f6f6f4;color:#242424;font-family:system-ui,Arial}main{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 18px}header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid #ddd}button{cursor:pointer;border:1px solid #ddd;border-radius:10px;padding:11px;background:white}#chat{flex:1;display:flex;flex-direction:column;gap:16px;padding:25px 0;overflow-y:auto}.msg{white-space:pre-wrap;line-height:1.5;max-width:85%;padding:12px 16px;border-radius:16px}.user{align-self:flex-end;background:#222;color:white}.assistant{align-self:flex-start;background:#e9e9e6}form{display:flex;gap:10px;padding:16px 0 24px}textarea{flex:1;resize:vertical;min-height:48px;max-height:150px;border-radius:12px;padding:12px;font:inherit;border:1px solid #ccc}form button{background:#222;color:white}small{color:#777}h1{font-size:24px}</style></head><body><main><header><div><h1>Conversation</h1><small>A place to talk.</small></div><button id="new">New Conversation</button></header><section id="chat" aria-live="polite"><div class="msg assistant">Hello. What's on your mind?</div></section><form id="form"><textarea id="input" required placeholder="Say something…" aria-label="Message"></textarea><button id="send">Send</button></form></main><script>const chat=document.getElementById('chat'),form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send');let messages=[];function add(role,content){const div=document.createElement('div');div.className='msg '+role;div.textContent=content;chat.append(div);div.scrollIntoView({block:'end'});return div}document.getElementById('new').onclick=()=>{messages=[];chat.innerHTML='';add('assistant',"Hello. What's on your mind?")};input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});form.onsubmit=async e=>{e.preventDefault();const content=input.value.trim();if(!content)return;input.value='';add('user',content);messages.push({role:'user',content});send.disabled=true;const pending=add('assistant','Thinking…');try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});const data=await res.json();if(!res.ok)throw Error(data.error||'Something went wrong');pending.textContent=data.reply;messages.push({role:'assistant',content:data.reply})}catch(err){pending.textContent=err.message;messages.pop()}finally{send.disabled=false;input.focus()}};</script></body></html>
